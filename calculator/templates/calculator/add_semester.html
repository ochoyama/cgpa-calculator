{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#151c5a"
    >

    <link
        rel="manifest"
        href="{% static 'calculator/manifest.json' %}"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'calculator/icons/icon-192.png' %}"
    >

    <title>
        Add Semester | A-DEVS CGPA Calculator
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #151c5a;

            margin: 0;

            padding: 0;
        }


        .connection-status {

            display: none;

            width: 100%;

            padding: 12px 20px;

            text-align: center;

            font-weight: bold;

            position: fixed;

            top: 0;

            left: 0;

            z-index: 9999;
        }


        .connection-status.offline {

            display: block;

            background: #fff3cd;

            color: #664d03;
        }


        .connection-status.online {

            display: block;

            background: #d1e7dd;

            color: #0f5132;
        }


        .offline-disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        .container {

            width: 90%;

            max-width: 900px;

            margin: 50px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.1);
        }


        h1 {

            text-align: center;

            margin-bottom: 10px;
        }


        .student-name {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        .semester-details {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

            margin-bottom: 30px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }


        input,
        select {

            width: 100%;

            padding: 12px;

            border:
                1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }


        .course-title {

            font-weight: bold;

            margin-bottom: 10px;

            font-size: 18px;
        }


        .course {

            display: grid;

            grid-template-columns:
                2fr 1fr 1fr;

            gap: 15px;

            margin-bottom: 15px;
        }


        button {

            padding: 12px 20px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }


        .add-btn {

            background: #198754;

            color: white;

            margin-top: 5px;
        }


        .save-btn {

            background: #0d6efd;

            color: white;

            width: 100%;

            margin-top: 20px;
        }


        .back-btn {

            display: block;

            text-align: center;

            background: #6c757d;

            color: white;

            text-decoration: none;

            padding: 12px;

            border-radius: 6px;

            margin-top: 15px;
        }


        .error {

            background: #f8d7da;

            color: #842029;

            padding: 15px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;
        }


        button:hover,
        .back-btn:hover {

            opacity: 0.9;
        }


        @media (max-width: 600px) {

            .semester-details {

                grid-template-columns:
                    1fr;
            }


            .course {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<div
    id="connectionStatus"
    class="connection-status"
>
</div>


<div class="container">


    <h1>
        Add Another Semester
    </h1>


    <p class="student-name">

        Student:

        <strong>
            {{ student.name }}
        </strong>

        <br>

        Matric Number:

        <strong>
            {{ student.matric_number }}
        </strong>

    </p>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form
        method="POST"
        id="semesterForm"
    >

        {% csrf_token %}


        <!-- SEMESTER DETAILS -->

        <div class="semester-details">


            <div>

                <label for="level">
                    Academic Level
                </label>


                <select
                    name="level"
                    id="level"
                    required
                >

                    <option value="">
                        Select Level
                    </option>

                    <option value="100">
                        100 Level
                    </option>

                    <option value="200">
                        200 Level
                    </option>

                    <option value="300">
                        300 Level
                    </option>

                    <option value="400">
                        400 Level
                    </option>

                    <option value="500">
                        500 Level
                    </option>

                    <option value="600">
                        600 Level
                    </option>

                </select>

            </div>


            <div>

                <label for="semester">
                    Semester
                </label>


                <select
                    name="semester"
                    id="semester"
                    required
                >

                    <option value="">
                        Select Semester
                    </option>

                    <option value="First Semester">
                        First Semester
                    </option>

                    <option value="Second Semester">
                        Second Semester
                    </option>

                </select>

            </div>


        </div>


        <!-- COURSES -->

        <div class="course-title">
            Course Details
        </div>


        <div id="courses">


            <div class="course">

                <input
                    type="text"
                    name="course"
                    placeholder="Course Code e.g. CSC201"
                >


                <input
                    type="number"
                    name="unit"
                    placeholder="Units"
                    min="1"
                    max="10"
                >


                <select name="grade">

                    <option value="">
                        Select Grade
                    </option>

                    <option value="A">
                        A
                    </option>

                    <option value="B">
                        B
                    </option>

                    <option value="C">
                        C
                    </option>

                    <option value="D">
                        D
                    </option>

                    <option value="E">
                        E
                    </option>

                    <option value="F">
                        F
                    </option>

                </select>

            </div>


        </div>


        <!-- ADD COURSE -->

        <button
            type="button"
            class="add-btn"
            onclick="addCourse()"
        >
            + Add Another Course
        </button>


        <!-- SAVE -->

        <button
            type="submit"
            class="save-btn"
            id="saveSemesterBtn"
        >
            Save Semester
        </button>


        <!-- BACK -->

        <a
            href="{% url 'academic_record' student.matric_number %}"
            class="back-btn"
        >
            Back to Academic Record
        </a>


    </form>


</div>


<script>

    function addCourse() {

        const courses =
            document.getElementById(
                "courses"
            );


        const course =
            document.createElement(
                "div"
            );


        course.classList.add(
            "course"
        );


        course.innerHTML = `

            <input
                type="text"
                name="course"
                placeholder="Course Code e.g. CSC202"
            >

            <input
                type="number"
                name="unit"
                placeholder="Units"
                min="1"
                max="10"
            >

            <select name="grade">

                <option value="">
                    Select Grade
                </option>

                <option value="A">
                    A
                </option>

                <option value="B">
                    B
                </option>

                <option value="C">
                    C
                </option>

                <option value="D">
                    D
                </option>

                <option value="E">
                    E
                </option>

                <option value="F">
                    F
                </option>

            </select>

        `;


        courses.appendChild(
            course
        );

    }

</script>


<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            async function () {

                try {

                    const registration =
                        await navigator.serviceWorker.register(
                            "/service-worker.js",
                            {
                                scope: "/"
                            }
                        );

                    console.log(
                        "Service Worker registered:",
                        registration.scope
                    );

                }

                catch (error) {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                }

            }
        );

    }

</script>


<script>

    const connectionStatus =
        document.getElementById(
            "connectionStatus"
        );

    const semesterForm =
        document.getElementById(
            "semesterForm"
        );

    const saveSemesterBtn =
        document.getElementById(
            "saveSemesterBtn"
        );

    let onlineMessageTimer;


    function showOfflineStatus() {

        clearTimeout(
            onlineMessageTimer
        );

        connectionStatus.textContent =
            "📡 You are offline. Semester results cannot be saved until your connection returns.";

        connectionStatus.className =
            "connection-status offline";

        saveSemesterBtn.disabled =
            true;

        saveSemesterBtn.classList.add(
            "offline-disabled"
        );

    }


    function showOnlineStatus() {

        clearTimeout(
            onlineMessageTimer
        );

        connectionStatus.textContent =
            "✅ Internet connection restored. Semester saving is available again.";

        connectionStatus.className =
            "connection-status online";

        saveSemesterBtn.disabled =
            false;

        saveSemesterBtn.classList.remove(
            "offline-disabled"
        );

        onlineMessageTimer =
            setTimeout(
                function () {

                    connectionStatus.className =
                        "connection-status";

                    connectionStatus.textContent =
                        "";

                },
                3000
            );

    }


    window.addEventListener(
        "offline",
        showOfflineStatus
    );

    window.addEventListener(
        "online",
        showOnlineStatus
    );


    if (!navigator.onLine) {

        showOfflineStatus();

    }


    semesterForm.addEventListener(
        "submit",
        function(event) {

            if (!navigator.onLine) {

                event.preventDefault();

                alert(
                    "You are offline. Please reconnect before saving this semester."
                );

            }

        }
    );

</script>


</body>

</html>
