<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recover Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151c5a;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {

            width: 92%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.10);
        }

        h1 {

            text-align: center;

            margin-top: 0;

            color: #222;
        }

        .description {

            text-align: center;

            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #0d6efd;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #0d6efd;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #0b5ed7;
        }

        .messages {

            margin-bottom: 20px;
        }

        .message {

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 10px;

            background: #f8d7da;

            color: #842029;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            text-decoration: none;

            color: #0d6efd;

            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Recover Password
    </h1>

    <p class="description">

        Enter your matric number and the email
        address associated with your student account.

    </p>


    <!-- MESSAGES -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- FORM -->

    <form
        method="POST"
    >

        {% csrf_token %}


        <div class="form-group">

            <label for="matric_number">
                Matric Number
            </label>

            <input
                type="text"
                id="matric_number"
                name="matric_number"
                placeholder="Enter your matric number"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

        </div>


        <button type="submit">

            Verify Account

        </button>

    </form>


    <a
        href="{% url 'login' %}"
        class="back"
    >

        ← Back to Login

    </a>

</div>

</body>

</html>
