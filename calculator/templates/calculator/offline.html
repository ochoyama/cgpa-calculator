<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#151c5a"
    >

    <title>Offline | CGPA Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            background: #151c5a;
        }

        .card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px 25px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #151c5a;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .status {
            margin: 20px 0;

            padding: 12px;

            border-radius: 8px;

            background: #fff3cd;

            color: #856404;

            font-weight: bold;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 7px;

            background: #198754;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .home-link {
            display: block;

            margin-top: 15px;

            text-decoration: none;

            color: #0d6efd;

            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        📡
    </div>

    <h1>
        You Are Offline
    </h1>

    <p>
        Your device is currently not connected to the internet.
    </p>

    <div class="status">
        Some previously visited pages may still be available.
    </div>

    <p>
        When your connection returns, reload the page
        to continue using the CGPA Calculator.
    </p>

    <button onclick="window.location.reload()">
        Try Again
    </button>

    <a
        href="/"
        class="home-link"
    >
        Go to Home
    </a>

</div>

<script>

    window.addEventListener(
        "online",
        function() {

            window.location.reload();

        }
    );

</script>

</body>

</html>
