<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151c5a;
        }

        .container {
            width: 92%;
            max-width: 450px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #0d6efd;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #0d6efd;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Reset Your Password
        </h1>

        <p>
            Enter the email address associated with your
            student account. We will send you a password
            reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="back">

            <a href="{% url 'login' %}">
                Back to Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
