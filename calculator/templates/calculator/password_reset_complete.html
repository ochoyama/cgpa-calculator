<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151c5a;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #1eb137;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .login-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Password Reset Successful</h1>

        <div class="success">
            Your password has been changed successfully.
        </div>

        <p>
            You can now log in to your student account
            using your new password.
        </p>

        <a
            href="{% url 'login' %}"
            class="login-button"
        >
            Go to Student Login
        </a>

    </div>

</div>

</body>

</html>
