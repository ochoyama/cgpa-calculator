<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Email Sent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151c5a;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Check Your Email</h1>

        <div class="success">
            Password reset instructions have been sent.
        </div>

        <p>
            If an account exists with the email address you entered,
            you will receive instructions for resetting your password.
        </p>

        <p>
            Check your email and follow the password reset link.
        </p>

        <a href="{% url 'login' %}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
